<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090a0d">
  <title>Hesap Yasaklandı · Naxsim</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .ban-screen { display:grid; place-items:center; min-height:100vh; padding:24px; background:radial-gradient(ellipse at 50% 30%,rgba(250,49,80,.12),transparent 42%),#090a0d; }
    .ban-panel { width:min(100%,460px); padding:32px; border:1px solid #443039; border-radius:4px; background:#101216; text-align:center; }
    .ban-mark { display:grid; place-items:center; width:52px; height:52px; margin:0 auto 19px; border:1px solid rgba(250,49,80,.46); border-radius:50%; background:rgba(250,49,80,.08); color:#ff526b; font:700 25px 'Barlow Condensed',sans-serif; }
    .ban-kicker { margin-bottom:8px; color:#ff8797; font:700 8px 'DM Sans',sans-serif; letter-spacing:1.5px; }
    .ban-panel h1 { margin:0 0 10px; color:#f2eff0; font:800 34px 'Barlow Condensed',sans-serif; }
    .ban-panel p { margin:0; color:#9a9ca4; font:10px/1.75 'DM Sans',sans-serif; }
    .ban-state { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:22px; padding-top:14px; border-top:1px solid #282a30; color:#ff8797; font:700 8px 'DM Sans',sans-serif; letter-spacing:.8px; }
    .ban-state i { width:6px; height:6px; border-radius:50%; background:#fa3150; }
  </style>
</head>
<body>
  <main class="ban-screen">
    <section class="ban-panel" role="status" aria-live="polite">
      <span class="ban-mark" aria-hidden="true">!</span>
      <div class="ban-kicker">NAXSIM E-SPORTS · HESAP DURUMU</div>
      <h1>HESABIN YASAKLANDI.</h1>
      <p>Bu hesapla site işlemlerine erişim geçici olarak kapatıldı. Yasak süresi boyunca sohbet, turnuva ve profil işlemleri kullanılamaz.</p>
      <div class="ban-state"><i></i> ERİŞİM ENGELLİ</div>
    </section>
  </main>
</body>
</html>
