<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>Erişim Filtrelendi · Naxsim</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .blocked-screen { display:grid; place-items:center; min-height:100vh; padding:24px; background:radial-gradient(ellipse at 50% 30%,rgba(250,49,80,.12),transparent 42%),#090a0d; }
    .blocked-panel { width:min(100%,440px); padding:30px; border:1px solid #34363d; border-radius:4px; background:#101216; text-align:center; }
    .blocked-mark { display:grid; place-items:center; width:46px; height:46px; margin:0 auto 18px; border:1px solid rgba(250,49,80,.4); border-radius:50%; color:#fa3150; font:700 23px 'Barlow Condensed',sans-serif; }
    .blocked-panel h1 { margin:0 0 9px; font:800 31px 'Barlow Condensed',sans-serif; }
    .blocked-panel p { margin:0 0 20px; color:#9a9ca4; font:10px/1.7 'DM Sans',sans-serif; }
    .blocked-panel a { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:0 15px; border-radius:3px; background:#fa3150; color:#fff; font:700 10px 'DM Sans',sans-serif; text-decoration:none; }
  </style>
</head>
<body>
  <main class="blocked-screen">
    <section class="blocked-panel">
      <span class="blocked-mark" aria-hidden="true">!</span>
      <h1>İSTEK FİLTRELENDİ.</h1>
      <p>Otomatik veya desteklenmeyen bir tarayıcı isteği algılandı. Normal bir tarayıcı kullandığını düşünüyorsan ana sayfadan tekrar deneyebilirsin.</p>
      <a href="/">Ana Sayfaya Dön</a>
    </section>
  </main>
</body>
</html>
